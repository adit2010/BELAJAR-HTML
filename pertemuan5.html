<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pertemuan 5</title>
</head>
<body>
    <h1>🤣Strong, Emphasis, Blockquote, quote🤣</h1>
    <br>
    <!-- Strong -->
    <p>This is an important <strong>shit</strong></p>
    <br>

    <!-- Emphasis -->
    <p>This is an important <em>shit</em></p>
    <br>

    <!-- blockquote -->
     <p><blockquote>this is an important shit</blockquote></p>
    <br>

    <!-- quote -->
    <p><p>this is an important shit</p></p>

</body>
</html>
